<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Set password · {{ app_name }}</title>
  <link rel="icon" type="image/png" href="/static/img/logo.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <div class="auth-card">
    <div class="logo">
      <img src="/static/img/logo.png" alt="Technovision" />
    </div>
    <div class="name">{% if forced %}Set your password{% else %}Change password{% endif %}</div>
    {% if forced %}
    <p class="auth-ok">First login: choose a new password to continue.</p>
    {% endif %}
    {% if error %}
    <p class="auth-error">{{ error }}</p>
    {% endif %}
    <form method="post" action="/change-password" autocomplete="off">
      <div class="form-field">
        <i class="fas fa-key"></i>
        <input type="password" name="current_password" placeholder="Current / temporary password" required />
      </div>
      <div class="form-field">
        <i class="fas fa-lock"></i>
        <input type="password" name="new_password" placeholder="New password" required minlength="4" />
      </div>
      <div class="form-field">
        <i class="fas fa-lock"></i>
        <input type="password" name="confirm_password" placeholder="Confirm new password" required minlength="4" />
      </div>
      <button class="btn" type="submit">Save password</button>
    </form>
    {% if not forced %}
    <p class="auth-switch"><a href="/">Back to dashboard</a></p>
    {% else %}
    <p class="auth-switch"><a href="/logout">Logout</a></p>
    {% endif %}
  </div>
</body>
</html>
