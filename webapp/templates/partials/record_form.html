<div class="form-group">
  <label>Title</label>
  <input type="text" name="title" class="form-control" required maxlength="200" placeholder="Short name"
    {% if record %}value="{{ record['title'] }}"{% endif %} {% if not can_write %}readonly{% endif %} />
</div>
<div class="form-group">
  <label>Status</label>
  <input type="text" name="status" class="form-control" maxlength="40"
    value="{{ record['status'] if record else 'Open' }}" {% if not can_write %}readonly{% endif %} />
</div>
<div class="form-group">
  <label>Notes</label>
  <textarea name="notes" class="form-control" rows="{{ rows|default(3) }}" maxlength="500" placeholder="Optional context" {% if not can_write %}readonly{% endif %}>{% if record %}{{ record['notes'] }}{% endif %}</textarea>
</div>
