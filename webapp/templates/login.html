<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login · {{ app_name }}</title>
  <link rel="icon" type="image/png" href="/static/img/logo.png" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <div class="auth-card">
    <div class="logo">
      <img src="/static/img/logo.png" alt="Technovision" />
    </div>
    <div class="name">Login</div>
    {% if error %}
    <p class="auth-error">{{ error }}</p>
    {% endif %}
    {% if message %}
    <p class="auth-ok">{{ message }}</p>
    {% endif %}
    <form method="post" action="/login" autocomplete="off">
      <div class="form-field">
        <i class="fa-solid fa-user-tie"></i>
        <input type="text" name="username" placeholder="Username" required />
      </div>
      <div class="form-field">
        <i class="fas fa-key"></i>
        <input type="password" name="password" placeholder="Password" required />
      </div>
      <button class="btn" type="submit">Login</button>
    </form>
    <p class="auth-switch">Accounts are created by TE Management / Admin.</p>
  </div>
  <p class="auth-foot"><a href="{{ company_url }}" target="_blank">{{ company_name }}</a></p>
</body>
</html>
